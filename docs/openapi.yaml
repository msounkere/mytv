openapi: 3.0.3
info:
  title: mytv API v1
  version: 1.0.0
  description: |
    Contrat de l'API HTTP de mytv. Toutes les routes sont sous `/api/v1`.

    Principes (a relire) :
    - **JSON type** : chaque reponse a un schema ferme ; les temps sont en RFC 3339 UTC,
      les durees en secondes (entiers).
    - **Aucun identifiant fournisseur dans une URL** : jamais d'utilisateur/mot de passe Xtream,
      ni d'adresse du fournisseur. Les contenus sont designes par un identifiant stable
      `<fournisseur>:<numero>` (ex. `iptva:845410`), et chaque contenu expose son adresse de
      lecture RELATIVE (`lecture`) servie par ce service.
    - **Authentification par defaut** : tout exige une session (cookie) sauf `GET /sante` et
      `POST /connexion`. Les routes de lecture (`/live/*`, `/vod/*`) acceptent aussi le compte
      technique local (lecteurs sans cookie), depuis les plages reseau configurees uniquement.
    - **Pagination** : `limite` (1..`api.pagination_max`, defaut `api.pagination_defaut`) et
      `decalage` (>= 0). Enveloppe `{elements, limite, decalage, suivant}` ; `suivant` est le
      decalage de la page suivante, `null` a la fin.
    - **ETag** : les routes de catalogue repondent avec un ETag faible lie a la derniere
      synchronisation ; `If-None-Match` correspondant donne `304` sans corps.
    - **Erreurs** : toujours `{code, message}` (schema `Erreur`), `code` stable et lisible par une
      machine, `message` en francais sans donnee sensible.
    - **Fournisseur en erreur (502)** : trois codes distincts, tous en `502` (jamais `401`/`403`, que
      l'interface lit comme « session expiree ») : `fournisseur_indisponible` (panne, delai, 5xx : reessayer),
      `fournisseur_compte_invalide` (le fournisseur a repondu 401/403 : abonnement expire ou refuse ; la date
      d'expiration est donnee dans `expiration` si le fournisseur l'a publiee) et `fournisseur_adresse_refusee`
      (458 : l'adresse du serveur est refusee par le fournisseur). Les deux derniers ne se soignent pas en
      reessayant : l'administrateur est prevenu (`/admin/fournisseurs`, journal, webhook). Le code est repete
      dans l'en-tete `X-Mytv-Erreur` (et la date dans `X-Mytv-Expiration`) : une reponse a `HEAD` n'a pas de
      corps, et hls.js ne rend que les en-tetes d'une reponse en echec.
    - **Limites** : corps de requete borne par `api.corps_max` (`413 corps_trop_gros`), delais de
      lecture/ecriture de la configuration (sauf flux `live`/`vod`, sans delai d'ecriture).
    - **Facettes (pays, langue, genre, annee, service)** : le serveur ne les calcule PAS. Il garantit
      que `nom` (categories, chaines, films, series) est le libelle BRUT du fournisseur (« VOD - CRIME-THRILLER [FR] »,
      « FR - TF1 ») et que `annee`, `note`, `ajoute` et `extension` sont fournis quand le fournisseur les donne.
      L'interface en derive ses facettes (`src/lib/facettes.ts`) : decision documentee, car le vocabulaire
      est un choix d'affichage, pas une donnee du fournisseur.
    - **Cast (diffusion vers un televiseur, US-40)** : l'interface demande `POST /cast/lien` pour la
      `lecture` d'une chaine ou d'un contenu et recoit un **lien signe a duree limitee**
      (`/cast/{jeton}/live/<chaine>.m3u8` ou `/cast/{jeton}/vod/<id>`, `comptes.cast_duree`, 12 h par defaut)
      que l'appareil de diffusion va chercher SANS cookie, d'ou qu'il soit (reseau local ou Internet). Le jeton
      est chiffre et authentifie (`serveur.secret_signature`, domaine distinct des segments et des images) et
      porte la session, la ressource et l'expiration : la requete est servie COMME SI elle venait de cette
      session (meme bail, meme place chez le fournisseur) ; une session revoquee rend le lien invalide (`401
      jeton_invalide`). Les playlists servies sous le lien annoncent leurs segments sous le meme prefixe signe.
      Le compte technique local (`comptes.plages_locales`) reste disponible pour les autres lecteurs du reseau
      local, mais n'est plus necessaire a la diffusion.
    - **Direct mono-fournisseur** : le relais du direct sert UN fournisseur (le plus prioritaire) ;
      `/chaines` n'annonce que les chaines de celui-ci.
    - **Images** : les champs `logo` et `image` ne portent jamais l'adresse d'origine du fournisseur ;
      ils valent `/api/v1/image/<jeton>` (toutes les URL http(s) sont reecrites, y compris les https ;
      chaine vide = pas d'image). Le jeton est chiffre et authentifie (`serveur.secret_signature`) :
      il est STABLE pour une meme image, n'est valable que sur ce serveur et ne peut jamais viser une
      URL libre. L'interface n'a besoin d'aucun hote tiers (CSP `img-src 'self' data:`).
    - **CORS ferme** par defaut (`api.origines_cors` vide) ; les requetes d'ecriture portant un
      `Origin` etranger sont refusees (403).
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: sante }
  - { name: compte }
  - { name: catalogue }
  - { name: live }
  - { name: vod }
  - { name: cast }
  - { name: epg }
  - { name: profil }
  - { name: admin }
paths:
  /sante:
    get:
      tags: [sante]
      operationId: sante
      summary: Sonde de vie, sans authentification et sans detail
      security: []
      responses:
        "200":
          description: Le service repond
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sante" }
  /connexion:
    post:
      tags: [compte]
      operationId: connexion
      summary: Ouvre une session (cookie HttpOnly, SameSite=Lax)
      description: |
        Meme reponse `401 identifiants_invalides` pour un compte inconnu et un mauvais mot de
        passe. `429` apres trop d'echecs (par compte et par adresse), delai croissant.
        Le jeton n'est JAMAIS dans le corps : seulement dans `Set-Cookie`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Connexion" }
      responses:
        "200":
          description: Session ouverte
          headers:
            Set-Cookie: { schema: { type: string }, description: "Cookie de session (HttpOnly, SameSite=Lax, Secure selon la config)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/Erreur" }
        "415": { $ref: "#/components/responses/Erreur" }
        "429": { $ref: "#/components/responses/TropDeTentatives" }
  /deconnexion:
    post:
      tags: [compte]
      operationId: deconnexion
      summary: Revoque la session et rend la place de connexion du fournisseur
      responses:
        "204": { description: "Deconnecte, cookie efface" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /compte:
    get:
      tags: [compte]
      operationId: compte
      summary: Session courante et profils du compte
      responses:
        "200":
          description: Le compte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compte" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /compte/mot-de-passe:
    post:
      tags: [compte]
      operationId: changerMotDePasse
      summary: Change le mot de passe et revoque les autres sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangementMotDePasse" }
      responses:
        "204": { description: "Mot de passe change" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "429": { $ref: "#/components/responses/TropDeTentatives" }
  /compte/profils:
    get:
      tags: [compte]
      operationId: profils
      summary: Profils du compte
      responses:
        "200":
          description: Les profils, du plus ancien au plus recent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListeProfils" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
    post:
      tags: [compte]
      operationId: creerProfil
      summary: Cree un profil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NouveauProfil" }
      responses:
        "201":
          description: Profil cree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profil" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/Erreur" }
  /compte/profils/{profil}:
    delete:
      tags: [compte]
      operationId: supprimerProfil
      summary: Supprime un profil du compte
      parameters:
        - { name: profil, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "204": { description: "Profil supprime (son etat avec)" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /compte/profil-actif:
    put:
      tags: [compte]
      operationId: choisirProfil
      summary: Choisit le profil actif de la session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilActif" }
      responses:
        "204": { description: "Profil actif change" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /categories:
    get:
      tags: [catalogue]
      operationId: categories
      summary: Categories d'un type de contenu
      parameters:
        - { name: type, in: query, required: true, schema: { $ref: "#/components/schemas/TypeContenu" } }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Categories ordonnees
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCategories" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /chaines:
    get:
      tags: [catalogue]
      operationId: chaines
      summary: Chaines (filtre par categorie, recherche, pagination)
      parameters:
        - { $ref: "#/components/parameters/Categorie" }
        - { $ref: "#/components/parameters/Recherche" }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une page de chaines
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageChaines" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /chaines/{id}:
    get:
      tags: [catalogue]
      operationId: chaine
      summary: Une chaine
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: La chaine
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chaine" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /films:
    get:
      tags: [catalogue]
      operationId: films
      summary: Films (filtre par categorie, recherche, pagination)
      parameters:
        - { $ref: "#/components/parameters/Categorie" }
        - { $ref: "#/components/parameters/Recherche" }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une page de films
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageFilms" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /films/{id}:
    get:
      tags: [catalogue]
      operationId: film
      summary: Un film, avec ses details (synopsis, genre, duree, casting...) quand ils existent
      description: |
        Les details viennent du fournisseur (`get_vod_info`), recuperes a l'ouverture de la fiche
        puis gardes longtemps (`metadonnees.duree_vie`). Un echec du fournisseur ne fait JAMAIS
        echouer la requete : la reponse porte alors les champs de la liste et
        `details_statut` = `indisponible`. L'ETag est calcule sur le corps.
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { $ref: "#/components/parameters/Details" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Le film
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilmDetail" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /series:
    get:
      tags: [catalogue]
      operationId: series
      summary: Series (filtre par categorie, recherche, pagination)
      parameters:
        - { $ref: "#/components/parameters/Categorie" }
        - { $ref: "#/components/parameters/Recherche" }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une page de series
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageSeries" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /series/{id}:
    get:
      tags: [catalogue]
      operationId: serie
      summary: Une serie, avec ses details (synopsis, genre, casting...) quand ils existent
      description: |
        Details issus de `get_series_info`, meme fonctionnement que pour un film. Les details
        de chaque episode (synopsis, image, date) sont dans `/series/{id}/saisons`.
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { $ref: "#/components/parameters/Details" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: La serie
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerieDetail" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /series/{id}/saisons:
    get:
      tags: [catalogue]
      operationId: saisons
      summary: Saisons et episodes d'une serie (interroge le fournisseur)
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
      responses:
        "200":
          description: Saisons et episodes, chaque episode a son adresse de lecture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListeSaisons" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "502": { $ref: "#/components/responses/Erreur" }
  /catalogue/version:
    get:
      tags: [catalogue]
      operationId: catalogueVersion
      summary: Manifeste du catalogue (version et effectifs), pour decider d'un import
      description: |
        Tres leger (une seule requete SQL de comptage). `version` est l'ETag (sans les guillemets
        ni le prefixe `W/`) commun a TOUS les exports : tant qu'il ne change pas, l'interface
        n'a aucune donnee a retelecharger. Il depend du CONTENU du catalogue (empreinte des
        identifiants, noms, categories, logos et champs exportes, calculee a l'ecriture) et des
        logos de repli du guide : une synchronisation qui ne change rien garde la meme version.
      parameters:
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Version et effectifs
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManifesteCatalogue" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /catalogue/export:
    get:
      tags: [catalogue]
      operationId: catalogueExport
      summary: Export en bloc d'un type de contenu (import initial de l'interface)
      description: |
        Flux NDJSON (`application/x-ndjson`, un objet JSON par ligne, ecrit au fil de l'eau : le
        serveur ne tient jamais tout le catalogue en memoire, le client peut parser par lots).
        Compresse en gzip quand `Accept-Encoding: gzip` (`Content-Encoding: gzip`). Les lignes ont
        EXACTEMENT les schemas `Chaine`, `Film`, `Serie` ou `Categorie` (memes champs que les
        listes pagineees, noms BRUTS du fournisseur, jamais retouches), triees par categorie puis
        ordre du fournisseur. Pas de pagination ni de plafond `pagination_max`.
        En-tetes : `ETag` = celui de `/catalogue/version` ; `X-Elements` = nombre de lignes
        (pour la barre de progression). `If-None-Match` correspondant -> `304` sans corps.
        `type=categories` renvoie les categories des TROIS types (champ `type` de chaque ligne).
        Une resynchronisation en cours d'envoi ne mele pas deux versions : la lecture se fait dans
        une transaction de lecture unique (instantane SQLite).
        Le direct etant mono-fournisseur, `type=live` n'exporte que les chaines de celui-ci.

        **Export par difference (US-36).** `depuis=<version>` (une `version` de manifeste recue
        autrefois) ne renvoie que les lignes ajoutees ou modifiees depuis cette version, precedees
        d'UNE premiere ligne de schema `Suppressions` (`{"type":"suppressions","ids":[...]}`, toujours
        presente, eventuellement vide) qui liste les identifiants disparus. `X-Elements` compte les
        lignes de contenu (sans cette premiere ligne), `X-Supprimes` le nombre d'identifiants supprimes.
        Le serveur garde les differences de `catalogue.historique_versions` versions : une version
        inconnue, trop ancienne, ou rendue caduque par un changement des logos du guide repond
        `409` (`code` = `version_inconnue`) et le client refait un import complet. `depuis` = version
        courante -> difference vide. `type=categories` ignore `depuis` (toujours complet, petit).
        Authentification : session. Charge : meme limite de debit que les autres routes.
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [categories, live, vod, series] } }
        - { name: depuis, in: query, required: false, description: "Version de manifeste deja importee : export par difference", schema: { type: string, maxLength: 64 } }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une ligne JSON par element (precedee d'une ligne `Suppressions` avec `depuis`)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Elements: { schema: { type: integer } }
            X-Supprimes: { description: "Avec `depuis` seulement : nombre d'identifiants supprimes", schema: { type: integer } }
          content:
            application/x-ndjson: { schema: { type: string } }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { description: "`depuis` inconnu ou trop ancien (`code` = `version_inconnue`) : refaire un import complet", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
  /recherche:
    get:
      tags: [catalogue]
      operationId: recherche
      summary: Recherche dans les chaines, films et series
      description: "`limite` s'applique a chacune des trois listes ; pas de `decalage` (utiliser les listes pour paginer)."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Resultats par type
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recherche" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /live/{fichier}:
    get:
      tags: [live]
      operationId: livePlaylist
      summary: Playlist HLS d'une chaine (`<numero>.m3u8`)
      description: |
        `fichier` = numero de la chaine suivi de `.m3u8` (champ `lecture` d'une chaine). Le relais
        est mono-fournisseur : le numero est celui du fournisseur du direct.
        Authentification : session OU compte technique local. Reservation de la connexion du
        fournisseur au premier appel (`503` + `Retry-After` si elle est occupee).

        **Conversion du direct (lot 5).** Les navigateurs ne lisent ni l'EAC3/AC3/DTS ni (Firefox) le HEVC.
        Le serveur sonde un segment de la chaine (une fois par `live.duree_sonde`, sans retarder une chaine
        deja sondee ; un echec de sonde laisse lire la chaine telle quelle) puis choisit, SELON LES CAPACITES
        du navigateur, le mode annonce dans `X-Mytv-Mode` :
        `direct` (h264+aac, ou format que le navigateur declare savoir lire : segments du fournisseur,
        aucun ffmpeg) ; `audio` (video copiee, audio converti en AAC stereo par ffmpeg) ; `video` (video
        reencodee en H.264 par ffmpeg, ~1 coeur, HEVC jusqu'a `live.hauteur_max_reencodage` seulement) ;
        `refus` (`415`, `code` = `format_hevc_non_lisible` pour un HEVC, `format_non_lisible` sinon ; le
        `message` nomme le codec et la hauteur, ex. la 4K HEVC pour un navigateur sans HEVC).
        Les capacites sont annoncees par `X-Mytv-Capacites` OU `?cap=` (union des deux) : liste separee par
        des virgules parmi `hevc`, `eac3`, `ac3` (valeurs inconnues ignorees). **Absence = navigateur suppose
        incapable de tout sauf h264+aac.** Il faut les annoncer a CHAQUE requete de playlist.
        `?forcer=audio|video` impose la conversion quand la sonde se trompe (prioritaire sur les capacites,
        aucune sonde) ; `direct` et `refus` ne se forcent pas (`400 forcer_invalide`). Il ne leve pas
        l'interdiction de reencoder (`live.reencodage_video: false`, ou 4K deja sondee : `415`).
        **Mode economie (US-38).** `?qualite=eco` (ou l'en-tete `X-Mytv-Qualite: eco` ; le parametre
        l'emporte ; `auto` ou absent = decision habituelle ; autre valeur : `400 qualite_invalide`) : la video
        est reencodee en H.264 a `live.eco.hauteur` (480p) et `live.eco.debit_kbps` (1200 kbit/s), audio AAC
        96 kbit/s, QUEL QUE SOIT le codec source (un h264 lisible compris : c'est le debit qu'on reduit), sous
        les memes bornes CPU que la conversion (`remux.processus_max`, file) et les memes interdits
        (`live.reencodage_video: false` ou 4K deja sondee : `415`). `X-Mytv-Mode` vaut alors `video` et la
        reponse porte `X-Mytv-Qualite: eco`. Un changement de qualite en cours de lecture (auto <-> eco)
        arrete l'ancien ffmpeg et en relance un : toujours un seul processus. A demander a CHAQUE requete
        de playlist, comme les capacites.
        En `audio`/`video`, la premiere reponse peut prendre quelques secondes (ffmpeg demarre ; borne
        `live.delai_demarrage_transcodage`) ; les segments sont servis sous `/live/{chaine}/seg/{jeton}`
        comme en direct (jetons lies a la chaine, stables d'une playlist a l'autre). Un seul transcodage a la
        fois : zapper, `POST /live/{chaine}/fin`, l'inactivite du lecteur (`live.inactivite_transcodage`) ou
        l'arret du service l'arretent et suppriment ses fichiers. `502` + `transcodage_impossible` : ffmpeg n'a
        rien produit dans le delai (reessayer, ou `?forcer=` / capacites autres).
      security: [{ session: [] }, { local: [] }]
      parameters:
        - { name: fichier, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}\.m3u8$' } }
        - { name: forcer, in: query, required: false, description: "Impose la conversion (`audio` ou `video`)", schema: { type: string, enum: [audio, video] } }
        - { name: cap, in: query, required: false, description: "Capacites du navigateur, ex. `hevc,eac3` (equivalent de `X-Mytv-Capacites`)", schema: { type: string, maxLength: 64 } }
        - { name: X-Mytv-Capacites, in: header, required: false, description: "Capacites du navigateur : `hevc`, `eac3`, `ac3` separes par des virgules", schema: { type: string, maxLength: 64 } }
        - { name: qualite, in: query, required: false, description: "`eco` : mode economie (video reencodee a `live.eco.*`) ; `auto` ou absent : decision habituelle", schema: { type: string, enum: [auto, eco] } }
        - { name: X-Mytv-Qualite, in: header, required: false, description: "Equivalent de `?qualite=` (le parametre l'emporte)", schema: { type: string, enum: [auto, eco] } }
      responses:
        "200":
          description: Playlist HLS (segments sous `/live/{chaine}/seg/{jeton}`)
          headers:
            X-Mytv-Mode: { description: "Mode retenu", schema: { type: string, enum: [direct, audio, video] } }
            X-Mytv-Qualite: { description: "`eco` quand le mode economie est applique ; absent sinon", schema: { type: string, enum: [eco] } }
            X-Mytv-Codec: { description: "`<codec video>+<codec audio>` vus par la sonde (`-` si absent) ; absent si la chaine n'a pas ete sondee", schema: { type: string, maxLength: 50 } }
            X-Mytv-Hauteur: { description: "Hauteur video sondee (pixels) ; absent si inconnue", schema: { type: integer } }
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "400": { description: "Chaine invalide, `?forcer=` hors liste (`code` = `forcer_invalide`) ou `?qualite=` hors liste (`qualite_invalide`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "415":
          description: "Chaine illisible pour ce navigateur et trop couteuse a convertir, ou mode economie impossible (`code` = `format_hevc_non_lisible` ou `format_non_lisible`) ; `X-Mytv-Mode: refus`, `X-Mytv-Codec` et `X-Mytv-Hauteur` renseignes"
          headers:
            X-Mytv-Mode: { schema: { type: string, enum: [refus] } }
            X-Mytv-Erreur: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } }
        "502": { description: "Fournisseur en erreur, ou `code` = `transcodage_impossible` (ffmpeg n'a rien produit)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "503": { $ref: "#/components/responses/Occupe" }
  /live/{chaine}/seg/{jeton}:
    get:
      tags: [live]
      operationId: liveSegment
      summary: Un segment HLS
      description: |
        `jeton` est signe et LIE a la chaine du chemin : un jeton d'une autre chaine est refuse
        (`403`). `Range` est transmis.
      security: [{ session: [] }, { local: [] }]
      parameters:
        - { name: chaine, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: jeton, in: path, required: true, schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: Octets du segment
          content:
            video/mp2t: { schema: { type: string, format: binary } }
        "206": { description: "Intervalle demande" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "502": { $ref: "#/components/responses/Erreur" }
        "503": { $ref: "#/components/responses/Occupe" }
  /live/{chaine}/fin:
    post:
      tags: [live]
      operationId: liveFin
      summary: L'interface a fini de lire cette chaine (rend la place du fournisseur tout de suite)
      description: |
        Corps vide. Libere le bail de la session SEULEMENT si elle lit encore `chaine` (apres un
        zapping, l'appel tardif de l'ancienne chaine ne fait rien). Idempotent, jamais `503`.
        Appele a la fermeture du lecteur (`fetch` avec `keepalive` ou `sendBeacon`). Session seulement (le compte technique local ne fait que lire) ; refuse si une requete d'ecriture porte un `Origin` etranger (comme
        toute ecriture). Sans cet appel, la place n'est rendue qu'a l'expiration du bail.
      parameters:
        - { name: chaine, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
      responses:
        "204": { description: "Fait (ou rien a faire)" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /live/etat:
    get:
      tags: [admin]
      operationId: liveEtat
      summary: Statistiques du relais du direct (administrateurs)
      responses:
        "200":
          description: |
            Mediane/p95/max des playlists et segments, essais, secours, patiences 407 ; `playlists_noeud` et
            `replis_noeud` (US-37 : playlists rechargees sur le noeud de diffusion retenu, et replis sur le central).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EtatLive" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
  /image/{jeton}:
    get:
      tags: [catalogue]
      operationId: image
      summary: Une image (logo, affiche) relayee par le serveur
      description: |
        `jeton` est celui du champ `logo` / `image` d'un contenu : jamais une URL. Un jeton modifie,
        tronque ou d'un autre secret est refuse (`403 jeton_invalide`). Le serveur telecharge l'image
        chez le fournisseur au premier appel (hote et adresse IP controles, redirections reverifiees,
        delai et taille bornes, aucun cookie ni identifiant transmis, aucun bail de connexion pris), la
        garde dans un cache disque borne, puis la sert avec `ETag` (`304` sur `If-None-Match`).
        Une image absente (`404`) ou en erreur (`502`) est memorisee quelques minutes
        (`images.cache_negatif`) pour ne pas marteler le fournisseur. `Content-Type` est toujours `image/*`.
      parameters:
        - { name: jeton, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,1000}$' } }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Octets de l'image
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { schema: { type: string, example: "private, max-age=86400" } }
          content:
            image/*: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/NonModifie" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403":
          description: Jeton invalide (`jeton_invalide`) ou adresse non autorisee (`hote_refuse`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "404":
          description: Image absente chez le fournisseur (`image_introuvable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "502":
          description: Image indisponible, trop grosse ou qui n'en est pas une (`image_indisponible`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "503": { $ref: "#/components/responses/Occupe" }
  /vod/{id}:
    get:
      tags: [vod]
      operationId: vodLecture
      summary: Lit un film ou un episode (Range pris en charge)
      description: |
        Remux ou transcodage audio automatiques si le navigateur ne sait pas lire le format.
        Authentification : session OU compte technique local.

        **Mode et duree lisibles par le client** : un `<video>` ne voit ni le statut d'erreur ni les
        en-tetes. L'interface envoie donc d'abord `HEAD /vod/{id}` : meme statut que `GET` (401, 404,
        415, 503 + `Retry-After`...), memes en-tetes, aucun octet de video, aucun ffmpeg lance. Sur
        `200`/`206` : `X-Mytv-Mode` = `direct` (relais d'octets, `Accept-Ranges: bytes`), `remux`
        ou `audio` (flux fabrique, `Accept-Ranges: none`, seek par `?t=`) ; `X-Mytv-Duree` = duree
        totale en secondes entieres quand la sonde la connait (absent sinon).

        **Mode economie (US-38).** `?qualite=eco` (ou `X-Mytv-Qualite: eco` ; le parametre l'emporte ;
        `auto` ou absent = decision habituelle ; autre valeur : `400`) : la video est reencodee en H.264 a
        `live.eco.hauteur` / `live.eco.debit_kbps` (480p, 1200 kbit/s, audio AAC 96 kbit/s), y compris un mp4
        H.264 que le navigateur lirait tel quel. `X-Mytv-Mode` vaut alors `eco` (il se comporte comme `remux` :
        flux fabrique, `Accept-Ranges: none`, seek par `?t=`) et la reponse porte `X-Mytv-Qualite: eco`, sur
        `HEAD` comme sur `GET`. Memes bornes CPU que le remux (`remux.processus_max`, file) ; un format refuse
        (HEVC : `415`) l'est toujours ; un changement de qualite en cours de lecture (nouvelle requete) remplace
        le remux en cours comme un seek. Sans cible configuree, le parametre est ignore.
      security: [{ session: [] }, { local: [] }]
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { name: Range, in: header, required: false, schema: { type: string, maxLength: 128 } }
        - { name: X-Mytv-Client, in: header, required: false, description: "`cast` : lecteur capable de lire le HEVC (voir 415)", schema: { type: string, maxLength: 16 } }
        - { name: qualite, in: query, required: false, description: "`eco` : mode economie (video reencodee a `live.eco.*`) ; `auto` ou absent : decision habituelle", schema: { type: string, enum: [auto, eco] } }
        - { name: X-Mytv-Qualite, in: header, required: false, description: "Equivalent de `?qualite=` (le parametre l'emporte)", schema: { type: string, enum: [auto, eco] } }
      responses:
        "200":
          description: Flux video
          headers:
            X-Mytv-Mode: { schema: { type: string, enum: [direct, remux, audio, eco] } }
            X-Mytv-Qualite: { description: "`eco` quand le mode economie est applique ; absent sinon", schema: { type: string, enum: [eco] } }
            X-Mytv-Duree: { schema: { type: integer }, description: "Duree totale en secondes (absent si inconnue)" }
          content:
            "video/*": { schema: { type: string, format: binary } }
        "206":
          description: "Intervalle demande, `Content-Range` coherent"
          headers:
            X-Mytv-Mode: { schema: { type: string, enum: [direct] } }
            X-Mytv-Duree: { schema: { type: integer } }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
        "415": { description: "Format non lisible dans un navigateur (`code` = `format_hevc_non_lisible` pour une video HEVC, `format_non_lisible` sinon ; le `message` nomme le codec). Avec `vod.relais_brut_hevc` actif, un client qui envoie `X-Mytv-Client: cast` recoit le HEVC tel quel (mode `direct`).", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "416": { $ref: "#/components/responses/Erreur" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "503": { $ref: "#/components/responses/Occupe" }
  /cast/lien:
    post:
      tags: [cast]
      operationId: castLien
      summary: Lien de diffusion signe, a duree limitee, pour un televiseur sans cookie
      description: |
        `lecture` est l'adresse de lecture d'une chaine (`/api/v1/live/<chaine>.m3u8`) ou d'un contenu
        (`/api/v1/vod/<id>`), telle que le catalogue la donne ; `parametres` (facultatif) est la chaine de
        parametres de lecture a recopier telle quelle dans le lien (`cap=hevc,eac3&qualite=auto` ;
        cles `cap`, `qualite`, `forcer`, `t` seulement). Repond le lien signe (relatif, a ouvrir sur
        l'origine de la page) et sa date d'expiration (`comptes.cast_duree` apres la demande).
        Le jeton designe la SESSION qui l'a demande : se deconnecter l'invalide. Session seulement
        (le lien est une emission, pas une lecture) ; politique CORS fermee comme toute ecriture.
        Metrique `cast_liens_total{type=live|vod}` ; journal INFO sans le jeton.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CastLienDemande" }
      responses:
        "200":
          description: Le lien signe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CastLien" }
        "400": { description: "`lecture` n'est ni une chaine ni un contenu du schema, ou `parametres` invalides (`code` = `requete_invalide`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /cast/{jeton}/{chemin}:
    get:
      tags: [cast]
      operationId: castLecture
      summary: Lecture par lien signe, sans cookie (playlist, segments, sous-playlists, contenu)
      description: |
        `chemin` est `live/<chaine>.m3u8`, `live/<chaine>/seg/<jeton-segment>` ou `vod/<id>` ; les parametres
        de requete sont ceux des routes `/live/{fichier}` et `/vod/{id}`, qui servent la reponse. `HEAD` accepte
        (meme reponse sans corps) ; `POST`, `PUT`, `DELETE` : `405`. Le jeton est verifie a chaque requete :
        authenticite, expiration, ressource (la chaine ou l'identifiant du chemin doit etre celle du jeton :
        `401 jeton_invalide` sinon) et session encore vivante (`401 jeton_invalide` apres deconnexion ou
        expiration de la session). Les adresses emises dans une playlist servie ici restent sous
        `/cast/{jeton}/live/...` (segments, sous-playlists, cles, segments de conversion).
        CORS ouvert pour les appareils de diffusion : `Access-Control-Allow-Origin: *` (sans credentials),
        `Access-Control-Expose-Headers` (les `X-Mytv-*`), `Cross-Origin-Resource-Policy: cross-origin`, et
        `204` au preflight `OPTIONS` (`Allow-Methods: GET, HEAD`, `Allow-Headers: Range`).
      security: [{ cast: [] }]
      parameters:
        - { name: jeton, in: path, required: true, description: "Jeton signe du lien (`POST /cast/lien`)", schema: { type: string, maxLength: 512 } }
        - { name: chemin, in: path, required: true, description: "`live/<chaine>.m3u8`, `live/<chaine>/seg/<jeton-segment>` ou `vod/<id>`", schema: { type: string, maxLength: 1200 } }
        - { name: Range, in: header, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: "La reponse de la route de lecture correspondante (`/live/{fichier}`, `/live/{chaine}/seg/{jeton}`, `/vod/{id}`), memes en-tetes `X-Mytv-*`"
          content:
            application/vnd.apple.mpegurl: { schema: { type: string } }
            video/mp2t: { schema: { type: string, format: binary } }
            "video/*": { schema: { type: string, format: binary } }
        "206": { description: "Intervalle demande" }
        "401": { description: "Jeton absent, altere, expire, emis pour une autre ressource ou session terminee (`code` = `jeton_invalide`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "404": { $ref: "#/components/responses/Erreur" }
        "405": { description: "Ecriture refusee (`code` = `methode_refusee`, en-tete `Allow: GET, HEAD`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "415": { $ref: "#/components/responses/Erreur" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "502": { $ref: "#/components/responses/Erreur" }
        "503": { $ref: "#/components/responses/Occupe" }
  /epg/chaines/{id}/maintenant:
    get:
      tags: [epg]
      operationId: epgMaintenant
      summary: Programme en cours et suivant d'une chaine
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
      responses:
        "200":
          description: Les deux programmes (null si inconnus)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnCours" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /epg/grille:
    get:
      tags: [epg]
      operationId: epgGrille
      summary: Grille des programmes de plusieurs chaines sur une plage
      description: |
        Une chaine inconnue ou sans guide donne un tableau vide (jamais une erreur). Reponse
        compressee en gzip quand `Accept-Encoding: gzip` (200 chaines x 6 h : ~500 Ko -> ~10 Ko).
      parameters:
        - name: chaines
          in: query
          required: true
          description: Identifiants separes par des virgules (au plus `api.pagination_max`).
          schema: { type: string, maxLength: 4096 }
        - { name: de, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: a, in: query, required: true, description: "Apres `de`, au plus `api.grille_fenetre_max` plus tard.", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Programmes par chaine, ordonnes par debut
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grille" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/favoris:
    get:
      tags: [profil]
      operationId: favoris
