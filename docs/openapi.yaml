        "204": { description: "Enregistre" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "422": { description: "Limite de profil atteinte (`code` = `limite_atteinte`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "501": { $ref: "#/components/responses/NonDisponible" }
    delete:
      tags: [profil]
      operationId: oublierLecture
      summary: Retire un contenu de l'historique
      parameters: [{ $ref: "#/components/parameters/ContenuID" }]
      responses:
        "204": { description: "Retire" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/reglages:
    get:
      tags: [profil]
      operationId: reglages
      summary: Reglages synchronises du profil actif
      responses:
        "200":
          description: Les reglages et leur revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reglages" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
    put:
      tags: [profil]
      operationId: ecrireReglages
      summary: Remplace les reglages si `revision` est la revision courante
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reglages" }
      responses:
        "200":
          description: Reglages a jour (nouvelle revision)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reglages" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { description: "Conflit de revision (`code` = `conflit`) ou profil requis", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "422": { description: "Limite de profil atteinte (`code` = `limite_atteinte`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /metriques:
    get:
      tags: [admin]
      operationId: metriques
      summary: Metriques au format Prometheus (administrateurs)
      responses:
        "200":
          description: Texte Prometheus
          content:
            text/plain: { schema: { type: string } }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /admin/fournisseurs:
    get:
      tags: [admin]
      operationId: etatFournisseurs
      summary: Etat du compte de chaque fournisseur (administrateurs)
      description: |
        Etat lu a la synchronisation et toutes les `supervision.intervalle_info` dans `user_info` du
        fournisseur (appel API sans flux, il ne prend pas la connexion unique du compte), puis erreurs
        vues en lecture. `etat` : `ok`, `compte_invalide`, `adresse_refusee`, `indisponible` ou `inconnu`
        (rien lu depuis le demarrage). L'etat est en memoire : il repart de `inconnu` au redemarrage,
        jusqu'a la premiere lecture de `user_info` (au demarrage). `alerte_expiration` est vrai a moins
        de `supervision.alerte_expiration` de l'expiration.
      responses:
        "200":
          description: Un element par fournisseur actif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EtatFournisseurs" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /admin/sante:
    get:
      tags: [admin]
      operationId: santeApprofondie
      summary: Sante approfondie (administrateurs) ; `/sante` reste sans detail pour le public
      description: |
        Controles : `base` (la base repond), `stockage` (le dossier de la base est ecrivable),
        `synchro:<id>` (derniere synchronisation reussie plus recente que 2 x `rafraichissement.catalogue`),
        `fournisseur:<id>` (user_info joignable et compte valide, sans ouvrir de flux). Reponse `200` si tout
        va bien, `503` avec le meme corps (`statut` = `degrade`) sinon. Le detail ne contient jamais le texte
        d'une erreur interne.
      responses:
        "200":
          description: Tout est en ordre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SanteApprofondie" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "503":
          description: Au moins un controle echoue (`statut` = `degrade`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SanteApprofondie" }
  /diagnostic/evenements:
    get:
      tags: [admin]
      operationId: diagnostic
      summary: Evenements recents, sans identifiant ni jeton (administrateurs)
      parameters:
        - { name: type, in: query, required: false, description: "Prefixe de type (`hls`, `video:erreur`...)", schema: { type: string, maxLength: 40 } }
        - { name: limite, in: query, required: false, description: "Defaut 200, maximum 1000", schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Evenements du plus recent au plus ancien
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostic" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
        "501": { $ref: "#/components/responses/NonDisponible" }
    post:
      tags: [admin]
      operationId: envoyerEvenements
      summary: L'interface envoie les evenements de lecture qu'elle subit (tout utilisateur connecte)
      description: |
        `Content-Type: application/json` obligatoire. Taille bornee par `diagnostic.envoi_max`,
        nombre d'evenements par `diagnostic.evenements_par_envoi` (le surplus est ignore),
        debit par session par `diagnostic.debit_evenements` (`429 trop_de_requetes`). Identifiants,
        jetons et chaines de requete sont masques avant tout stockage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvoiEvenements" }
      responses:
        "200":
          description: Evenements retenus et ignores
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recus, ignores]
                properties:
                  recus: { type: integer }
                  ignores: { type: integer }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "413": { description: "Envoi trop volumineux (`code` = `corps_trop_gros`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "415": { description: "Type de contenu autre que JSON (`code` = `format_non_json`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "429":
          description: Trop d'evenements (`code` = `trop_de_requetes`)
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } }
        "501": { $ref: "#/components/responses/NonDisponible" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-mytv
      description: Cookie de session (nom `mytv` quand `comptes.cookie_securise` est faux).
    local:
      type: apiKey
      in: header
      name: X-Aucun
      description: |
        Compte technique local : AUCUN en-tete, reconnu a l'adresse du client (plages
        `comptes.plages_locales`), GET/HEAD seulement, jamais administrateur.
    cast:
      type: apiKey
      in: header
      name: X-Aucun-Jeton-Dans-Le-Chemin
      description: |
        Lien de diffusion signe (US-40) : AUCUN en-tete ni cookie, le jeton est dans le chemin
        (`/cast/{jeton}/...`) et designe la session qui l'a demande ; GET/HEAD seulement, jamais
        administrateur, invalide des que la session l'est.
  headers:
    ETag:
      description: Etag faible ; renvoyez-le dans `If-None-Match`.
      schema: { type: string }
  parameters:
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1 }
      description: Taille de page (bornee par `api.pagination_max`).
    Decalage:
      name: decalage
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Categorie:
      name: categorie
      in: query
      schema: { type: string, maxLength: 128 }
      description: Identifiant de categorie `<fournisseur>:<id>` (champ `id` de `/categories`).
    Recherche:
      name: q
      in: query
      schema: { type: string, maxLength: 100 }
    ContenuID:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ContenuID" }
    SiAucuneCorrespondance:
      name: If-None-Match
      in: header
      schema: { type: string, maxLength: 256 }
    Details:
      name: details
      in: query
      description: "`non` : ne declenche AUCUN appel au fournisseur (ne renvoie que les details deja en cache). Defaut `oui` : les details manquants ou perimes sont recuperes a la demande (un appel par contenu, borne)."
      schema: { type: string, enum: ["oui", "non"], default: "oui" }
  responses:
    Erreur:
      description: Erreur
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    RequeteInvalide:
      description: Parametre ou corps invalide (`code` = `requete_invalide`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    NonAuthentifie:
      description: Session absente, expiree ou revoquee (`code` = `non_authentifie`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    Interdit:
      description: Reserve aux administrateurs (`code` = `interdit`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    TropDeTentatives:
      description: Limitation atteinte (`code` = `trop_de_tentatives`)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    NonModifie:
      description: Le catalogue n'a pas change depuis cet ETag (pas de corps)
    NonDisponible:
      description: Fonction non activee sur ce serveur (`code` = `non_disponible`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    Occupe:
      description: |
        Connexion du fournisseur occupee (le fournisseur repond 407 apres la patience du serveur).
        `code` (repete dans l'en-tete `X-Mytv-Erreur`, lisible par hls.js) :
        `compte_utilise_ailleurs` (le fournisseur annonce toutes ses places prises et mytv n'en tient aucune :
        un autre appareil utilise le compte -> message « fermez-le »), `compte_utilise_par_mytv` (une autre
        session mytv tient la connexion -> « une autre fenetre de MyTV »), `compte_occupe` (indetermine :
        user_info indisponible ou places libres cote fournisseur, qui garde la place quelques instants ->
        reessai automatique). `occupe` reste le code des autres saturations locales (images...).
        `Retry-After` (secondes) est CROISSANT par (session, chaine) selon les refus consecutifs : 15, 30, 60,
        puis 60 ; remis a zero apres un succes. Le client ne doit faire AUCUNE requete avant l'echeance.
      headers:
        Retry-After: { schema: { type: integer, enum: [15, 30, 60] } }
        X-Mytv-Erreur: { schema: { type: string, enum: [compte_utilise_ailleurs, compte_utilise_par_mytv, compte_occupe, occupe] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    ProfilRequis:
      description: Aucun profil actif sur la session (`code` = `profil_requis`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
  schemas:
    CastLienDemande:
      type: object
      additionalProperties: false
      required: [lecture]
      properties:
        lecture:
          type: string
          maxLength: 128
          description: "`/api/v1/live/<chaine>.m3u8` ou `/api/v1/vod/<id>` (champ `lecture` du catalogue)"
          example: "/api/v1/live/845410.m3u8"
        parametres:
          type: string
          maxLength: 256
          pattern: '^[A-Za-z0-9_.,:=&-]*$'
          description: "Parametres de lecture recopies tels quels dans le lien (`cap`, `qualite`, `forcer`, `t`)"
          example: "cap=hevc,eac3,ac3"
    CastLien:
      type: object
      additionalProperties: false
      required: [url, expire]
      properties:
        url:
          type: string
          description: "Lien signe, relatif a l'origine de la page : `/api/v1/cast/<jeton>/live/<chaine>.m3u8?...` ou `/api/v1/cast/<jeton>/vod/<id>?...`"
        expire:
          type: string
          format: date-time
          description: Fin de validite du lien (RFC 3339 UTC)
    Erreur:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable, en minuscules_et_underscores. Pour un fournisseur en erreur (502) :
            `fournisseur_indisponible`, `fournisseur_compte_invalide`, `fournisseur_adresse_refusee`.
            Direct converti : `format_hevc_non_lisible` / `format_non_lisible` (415), `forcer_invalide` (400),
            `transcodage_impossible` (502).
            Connexion du fournisseur occupee (503 + `Retry-After` croissant) : `compte_utilise_ailleurs`,
            `compte_utilise_par_mytv`, `compte_occupe` (voir la reponse `Occupe`) ; `occupe` pour les autres saturations.
        message: { type: string }
        expiration:
          type: string
          format: date-time
          description: Avec `fournisseur_compte_invalide` seulement, quand le fournisseur a publie une date d'expiration
    Sante:
      type: object
      additionalProperties: false
      required: [statut]
      properties:
        statut: { type: string, enum: [ok] }
    EtatFournisseurs:
      type: object
      additionalProperties: false
      required: [fournisseurs]
      properties:
        fournisseurs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, etat, statut_compte, expiration, expire_dans_secondes, alerte_expiration, connexions_max, connexions_actives,
                       info_lue_le, derniere_synchro_reussie, age_synchro_secondes, derniere_erreur, echecs_consecutifs,
                       occupation, depuis, derniere_prise]
            properties:
              id: { type: string }
              etat: { type: string, enum: [ok, compte_invalide, adresse_refusee, indisponible, inconnu] }
              statut_compte: { type: string, description: "`status` de user_info (Active, Expired...), vide si non lu" }
              expiration: { type: string, format: date-time, nullable: true, description: "null = illimitee ou inconnue" }
              expire_dans_secondes: { type: integer, nullable: true, description: "Negatif apres l'expiration" }
              alerte_expiration: { type: boolean }
              connexions_max: { type: integer }
              connexions_actives: { type: integer, description: "Indicatif : le fournisseur reel renvoie toujours 0" }
              info_lue_le: { type: string, format: date-time, nullable: true }
              derniere_synchro_reussie: { type: string, format: date-time, nullable: true }
              age_synchro_secondes: { type: integer, nullable: true }
              derniere_erreur:
                type: object
                nullable: true
                additionalProperties: false
                required: [code, quand, age_secondes]
                properties:
                  code: { type: string, description: "Un des codes `fournisseur_*`" }
                  quand: { type: string, format: date-time }
                  age_secondes: { type: integer }
              echecs_consecutifs: { type: integer }
              occupation: { type: string, enum: [libre, mytv, ailleurs], description: "Qui tient la connexion du fournisseur : libre, une session mytv, ou un autre appareil (prise de place detectee)" }
              depuis: { type: string, format: date-time, nullable: true, description: "Debut de l'etat d'occupation courant (null si libre depuis toujours)" }
              derniere_prise: { type: string, format: date-time, nullable: true, description: "Derniere coupure en lecture par un autre appareil (null si jamais)" }
    SanteApprofondie:
      type: object
      additionalProperties: false
      required: [statut, controles]
      properties:
        statut: { type: string, enum: [ok, degrade] }
        controles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nom, ok, detail]
            properties:
              nom: { type: string }
              ok: { type: boolean }
              detail: { type: string }
    ContenuID:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,32}:[A-Za-z0-9_.-]{1,64}$'
      example: "iptva:845410"
      description: |
        `<fournisseur>:<numero>`, unique entre TOUS les types de contenu. Chez Xtream, `stream_id`
        (chaines, films) et `series_id` sont deux espaces de numeros distincts : l'identifiant d'une
        **serie** porte donc un `s` devant le numero (`iptva:s77`), celui d'une chaine ou d'un film
        non (`iptva:845410`), celui d'un **episode** porte l'extension (`iptva:77123.mkv`). Le
        numero du fournisseur (sans prefixe) n'est jamais expose : les URL de lecture sont fournies
        (`lecture`, `saisons`).
    TypeContenu:
      type: string
      enum: [live, vod, series]
    Connexion:
      type: object
      additionalProperties: false
      required: [nom, mot_de_passe]
      properties:
        nom: { type: string, maxLength: 64 }
        mot_de_passe: { type: string, maxLength: 1024, format: password }
    Session:
      type: object
      additionalProperties: false
      required: [id, nom, admin, expire]
      properties:
        id: { type: string, description: "Identifiant stable de session ; ce n'est PAS le jeton" }
        nom: { type: string, description: "Nom du compte tel qu'il a ete cree (pour l'affichage ; pas un identifiant)" }
        admin: { type: boolean }
        profil_id: { type: string }
        expire: { type: string, format: date-time }
    Compte:
      type: object
      additionalProperties: false
      required: [session, profils, limites]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        profils:
          type: array
          items: { $ref: "#/components/schemas/Profil" }
        limites:
          type: object
          description: Bornes de la configuration, pour que l'interface decoupe ses appels sans les deviner.
          additionalProperties: false
          required: [pagination_max, grille_fenetre, favoris_max, historique_max, reglages_octets_max]
          properties:
            pagination_max: { type: integer, description: "Taille maximale d'une page ET nombre maximal de chaines d'un appel `/epg/grille`" }
            grille_fenetre: { type: integer, description: "Plage maximale d'un appel `/epg/grille`, en secondes" }
            favoris_max: { type: integer }
            historique_max: { type: integer }
            reglages_octets_max: { type: integer }
    ChangementMotDePasse:
      type: object
      additionalProperties: false
      required: [ancien, nouveau]
      properties:
        ancien: { type: string, maxLength: 1024, format: password }
        nouveau: { type: string, maxLength: 1024, format: password }
    Profil:
      type: object
      additionalProperties: false
      required: [id, nom]
      properties:
        id: { type: string }
        nom: { type: string, maxLength: 64 }
    NouveauProfil:
      type: object
      additionalProperties: false
      required: [nom]
      properties:
        nom: { type: string, maxLength: 64 }
    ProfilActif:
      type: object
      additionalProperties: false
      required: [profil_id]
      properties:
        profil_id: { type: string }
    ListeProfils:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items: { $ref: "#/components/schemas/Profil" }
    Pagination:
      type: object
      required: [limite, decalage, suivant]
      properties:
        limite: { type: integer }
        decalage: { type: integer }
        suivant: { type: integer, nullable: true, description: "Decalage de la page suivante, null a la fin" }
    ManifesteCatalogue:
      type: object
      additionalProperties: false
      required: [version, categories, chaines, films, series, synchronise]
      properties:
        version: { type: string, description: "Meme valeur que l'ETag (sans guillemets ni `W/`)" }
        categories: { type: integer }
        chaines: { type: integer }
        films: { type: integer }
        series: { type: integer }
        synchronise: { type: string, format: date-time, nullable: true, description: "Derniere synchronisation reussie (null si jamais)" }
    Suppressions:
      description: Premiere ligne d'un export par difference (`depuis`)
      type: object
      additionalProperties: false
      required: [type, ids]
      properties:
        type: { type: string, enum: [suppressions] }
        ids: { type: array, items: { type: string }, description: "Identifiants disparus depuis la version `depuis`" }
    Categorie:
      type: object
      additionalProperties: false
      required: [id, fournisseur, type, nom, ordre]
      properties:
        id: { type: string, description: "`<fournisseur>:<id chez le fournisseur>`", example: "iptva:12" }
        fournisseur: { type: string }
        type: { $ref: "#/components/schemas/TypeContenu" }
        nom: { type: string }
        ordre: { type: integer }
    Chaine:
      type: object
      additionalProperties: false
      required: [id, nom, numero, categorie, lecture]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        logo: { type: string, description: "Adresse relative `/api/v1/image/<jeton>` (jamais l'adresse du fournisseur). Quand le fournisseur ne donne pas de logo, celui du guide XMLTV (`<icon>`) sert de repli, s'il existe et que la chaine y est rapprochee sans ambiguite ; un logo du fournisseur n'est jamais remplace. Absent si aucun" }
        numero: { type: integer, description: Numero de chaine affiche }
        epg_id: { type: string }
        categorie: { type: string, description: "Identifiant de categorie `<fournisseur>:<id>`" }
        ajoute: { type: string, format: date-time, nullable: true, description: "Date d'ajout chez le fournisseur (null si inconnue)" }
        lecture: { type: string, description: "Adresse relative de la playlist HLS", example: "/api/v1/live/845410.m3u8" }
    Film:
      type: object
      additionalProperties: false
      required: [id, nom, categorie, extension, note, lecture]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        image: { type: string, description: "Adresse relative `/api/v1/image/<jeton>` ; absent si pas d'affiche" }
        categorie: { type: string }
        extension: { type: string }
        note: { type: number }
        annee: { type: string }
        ajoute: { type: string, format: date-time, nullable: true }
        lecture: { type: string, example: "/api/v1/vod/iptva:5521" }
    Serie:
      type: object
      additionalProperties: false
      required: [id, nom, categorie, note, saisons]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        image: { type: string, description: "Adresse relative `/api/v1/image/<jeton>` ; absent si pas d'affiche" }
        categorie: { type: string }
        note: { type: number }
        annee: { type: string }
        ajoute: { type: string, format: date-time, nullable: true, description: "Derniere modification chez le fournisseur (`last_modified`), null si inconnue" }
        saisons: { type: string, description: "Adresse relative des saisons", example: "/api/v1/series/iptva:s77/saisons" }
    DetailsStatut:
      type: string
      enum: [ok, perime, indisponible, absent, non_demande]
      description: |
        Provenance des details : `ok` (frais), `perime` (anciens details gardes, le fournisseur n'a pas pu
        les rafraichir), `indisponible` (echec, coupe-circuit ou debit : seulement les champs de la liste),
        `absent` (le fournisseur n'a pas de fiche), `non_demande` (`details=non` et rien en cache).
    DetailsCommuns:
      type: object
      additionalProperties: false
      description: Tous les champs sont facultatifs et absents quand le fournisseur ne les donne pas.
      properties:
        synopsis: { type: string }
        genre: { type: string }
        casting: { type: string }
        realisateur: { type: string }
        pays: { type: string }
        sortie: { type: string, description: "Date de sortie telle qu'ecrite par le fournisseur (« 2010-07-16 »)" }
        bande_annonce: { type: string, description: "Adresse https YouTube uniquement" }
        image_fond: { type: string, description: "Image de fond (passe par le proxy d'images quand il est actif)" }
        affiche: { type: string }
        note: { type: number }
        age: { type: string }
        duree: { type: integer, description: "Film : secondes" }
        duree_episode: { type: integer, description: "Serie : duree moyenne d'un episode, secondes" }
    FilmDetail:
      type: object
      additionalProperties: false
      description: Un film (champs de `Film`) et ses details.
      required: [id, nom, categorie, extension, note, lecture]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        image: { type: string }
        categorie: { type: string }
        extension: { type: string }
        note: { type: number }
        annee: { type: string }
        ajoute: { type: string, format: date-time, nullable: true }
        lecture: { type: string, example: "/api/v1/vod/iptva:5521" }
        details: { $ref: "#/components/schemas/DetailsCommuns" }
        details_statut: { $ref: "#/components/schemas/DetailsStatut" }
    SerieDetail:
      type: object
      additionalProperties: false
      description: Une serie (champs de `Serie`) et ses details.
      required: [id, nom, categorie, note, saisons]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        image: { type: string }
        categorie: { type: string }
        note: { type: number }
        annee: { type: string }
        ajoute: { type: string, format: date-time, nullable: true }
        saisons: { type: string, example: "/api/v1/series/iptva:s77/saisons" }
        details: { $ref: "#/components/schemas/DetailsCommuns" }
        details_statut: { $ref: "#/components/schemas/DetailsStatut" }
    Episode:
      type: object
      additionalProperties: false
      required: [id, numero, titre, extension, duree, lecture]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        numero: { type: integer }
        titre: { type: string }
        extension: { type: string }
        duree: { type: integer, description: secondes, 0 si inconnue }
        lecture: { type: string }
        synopsis: { type: string, description: "Resume de l'episode (absent si le fournisseur n'en donne pas)" }
        image: { type: string, description: "Vignette de l'episode (absente si inconnue)" }
        sortie: { type: string, description: "Date de diffusion telle qu'ecrite par le fournisseur" }
        note: { type: number, description: "Note sur 10 (absente si inconnue)" }
    Saison:
      type: object
      additionalProperties: false
      required: [numero, episodes]
      properties:
        numero: { type: integer }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Episode" }
    ListeSaisons:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items: { $ref: "#/components/schemas/Saison" }
    PageCategories:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Categorie" } }
    PageChaines:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Chaine" } }
    PageFilms:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Film" } }
    PageSeries:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Serie" } }
    PageIdentifiants:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/ContenuID" } }
    Recherche:
      type: object
      additionalProperties: false
      required: [chaines, films, series]
      properties:
        chaines: { type: array, items: { $ref: "#/components/schemas/Chaine" } }
        films: { type: array, items: { $ref: "#/components/schemas/Film" } }
        series: { type: array, items: { $ref: "#/components/schemas/Serie" } }
    Programme:
      type: object
      additionalProperties: false
      required: [debut, fin, titre]
      properties:
        debut: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        titre: { type: string }
        description: { type: string }
        categorie: { type: string }
        sous_titre: { type: string, maxLength: 300, description: "Sous-titre de l'emission (`<sub-title>` du guide), absent si inconnu" }
        episode: { type: string, maxLength: 30, description: "Numero lisible, ex. `S02E05` ou `E04` (`<episode-num>` du guide), absent si inconnu" }
        annee: { type: string, pattern: '^[0-9]{4}$', description: "Annee de production (`<date>` du guide), absente si inconnue ou invraisemblable" }
    EnCours:
      type: object
      additionalProperties: false
      required: [courant, suivant]
      properties:
        courant: { allOf: [{ $ref: "#/components/schemas/Programme" }], nullable: true }
        suivant: { allOf: [{ $ref: "#/components/schemas/Programme" }], nullable: true }
    Grille:
      type: object
      additionalProperties: false
      required: [chaines]
      properties:
        chaines:
          type: object
          description: Programmes par identifiant de chaine
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/Programme" }
    Lecture:
      type: object
      additionalProperties: false
      required: [contenu, position, duree, vu]
      properties:
        contenu: { $ref: "#/components/schemas/ContenuID" }
        serie: { $ref: "#/components/schemas/ContenuID", description: "Serie parente quand `contenu` est un episode" }
        position: { type: integer, description: "secondes" }
        duree: { type: integer, description: "secondes, 0 si inconnue (direct)" }
        vu: { type: string, format: date-time }
    ListeLectures:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements: { type: array, items: { $ref: "#/components/schemas/Lecture" } }
    Position:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        position: { type: integer, minimum: 0, description: "secondes" }
        duree: { type: integer, minimum: 0, description: "secondes" }
        serie:
          allOf: [{ $ref: "#/components/schemas/ContenuID" }]
          description: |
            REQUIS quand l'identifiant du contenu est un episode (`fournisseur:77123.mkv`,
            extension apres le numero), INTERDIT sinon (400). Doit etre une serie du catalogue du
            meme fournisseur : sans elle l'historique jugerait l'episode orphelin.
    Reglages:
      type: object
      additionalProperties: false
      required: [valeurs, revision]
      properties:
        valeurs:
          type: object
          additionalProperties: { type: string }
        revision: { type: integer, format: int64 }
    EtatLive:
      type: object
      description: Statistiques du relais (champs definis par internal/live, Resume).
      additionalProperties: true
    EnvoiEvenements:
      type: object
      additionalProperties: false
      required: [evenements]
      properties:
        appareil: { type: string, maxLength: 80, description: "Identifiant choisi par l'appareil ; seule une empreinte est conservee" }
        agent: { type: string, maxLength: 300 }
        evenements:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [type]
            properties:
              type: { type: string, maxLength: 40, description: "`echantillon`, `hls:*`, `video:*`, `image:retour`..." }
              message: { type: string }
    Diagnostic:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [horodatage, source, type]
            properties:
              horodatage: { type: string, format: date-time }
              source: { type: string, enum: [serveur, client] }
              type: { type: string }
              message: { type: string }
              appareil: { type: string, description: "Empreinte courte, jamais l'identifiant" }
              agent: { type: string }
              donnees: { type: object, additionalProperties: true }
