        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/favoris/{id}:
