openapi: 3.0.3
info:
  title: mytv API v1
  version: 1.0.0
  description: |
    Contrat de l'API HTTP de mytv. Toutes les routes sont sous `/api/v1`.

    Principes (a relire) :
    - **JSON type** : chaque reponse a un schema ferme ; les temps sont en RFC 3339 UTC,
      les durees en secondes (entiers).
    - **Aucun identifiant fournisseur dans une URL** : jamais d'utilisateur/mot de passe Xtream,
      ni d'adresse du fournisseur. Les contenus sont designes par un identifiant stable
      `<fournisseur>:<numero>` (ex. `iptva:845410`), et chaque contenu expose son adresse de
      lecture RELATIVE (`lecture`) servie par ce service.
    - **Authentification par defaut** : tout exige une session (cookie) sauf `GET /sante` et
      `POST /connexion`. Les routes de lecture (`/live/*`, `/vod/*`) acceptent aussi le compte
      technique local (lecteurs sans cookie), depuis les plages reseau configurees uniquement.
    - **Pagination** : `limite` (1..`api.pagination_max`, defaut `api.pagination_defaut`) et
      `decalage` (>= 0). Enveloppe `{elements, limite, decalage, suivant}` ; `suivant` est le
      decalage de la page suivante, `null` a la fin.
    - **ETag** : les routes de catalogue repondent avec un ETag faible lie a la derniere
      synchronisation ; `If-None-Match` correspondant donne `304` sans corps.
    - **Erreurs** : toujours `{code, message}` (schema `Erreur`), `code` stable et lisible par une
      machine, `message` en francais sans donnee sensible.
    - **Limites** : corps de requete borne par `api.corps_max` (`413 corps_trop_gros`), delais de
      lecture/ecriture de la configuration (sauf flux `live`/`vod`, sans delai d'ecriture).
    - **Facettes (pays, langue, genre, annee, service)** : le serveur ne les calcule PAS. Il garantit
      que `nom` (categories, chaines, films, series) est le libelle BRUT du fournisseur (« VOD - CRIME-THRILLER [FR] »,
      « FR - TF1 ») et que `annee`, `note`, `ajoute` et `extension` sont fournis quand le fournisseur les donne.
      L'interface en derive ses facettes (`src/lib/facettes.ts`) : decision documentee, car le vocabulaire
      est un choix d'affichage, pas une donnee du fournisseur.
    - **Cast** : il n'y a pas d'URL signee. Un recepteur Cast du reseau local lit `lecture` en absolu
      (origine de la page) SANS cookie, via le compte technique local (GET/HEAD, plages `comptes.plages_locales`).
      Hors reseau local, l'interface doit desactiver Cast.
    - **Direct mono-fournisseur** : le relais du direct sert UN fournisseur (le plus prioritaire) ;
      `/chaines` n'annonce que les chaines de celui-ci.
    - **Images** : les champs `logo` et `image` ne portent jamais l'adresse d'origine du fournisseur ;
      ils valent `/api/v1/image/<jeton>` (toutes les URL http(s) sont reecrites, y compris les https ;
      chaine vide = pas d'image). Le jeton est chiffre et authentifie (`serveur.secret_signature`) :
      il est STABLE pour une meme image, n'est valable que sur ce serveur et ne peut jamais viser une
      URL libre. L'interface n'a besoin d'aucun hote tiers (CSP `img-src 'self' data:`).
    - **CORS ferme** par defaut (`api.origines_cors` vide) ; les requetes d'ecriture portant un
      `Origin` etranger sont refusees (403).
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: sante }
  - { name: compte }
  - { name: catalogue }
  - { name: live }
  - { name: vod }
  - { name: epg }
  - { name: profil }
  - { name: admin }
paths:
  /sante:
    get:
      tags: [sante]
      operationId: sante
      summary: Sonde de vie, sans authentification et sans detail
      security: []
      responses:
        "200":
          description: Le service repond
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sante" }
  /connexion:
    post:
      tags: [compte]
      operationId: connexion
      summary: Ouvre une session (cookie HttpOnly, SameSite=Lax)
      description: |
        Meme reponse `401 identifiants_invalides` pour un compte inconnu et un mauvais mot de
        passe. `429` apres trop d'echecs (par compte et par adresse), delai croissant.
        Le jeton n'est JAMAIS dans le corps : seulement dans `Set-Cookie`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Connexion" }
      responses:
        "200":
          description: Session ouverte
          headers:
            Set-Cookie: { schema: { type: string }, description: "Cookie de session (HttpOnly, SameSite=Lax, Secure selon la config)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/Erreur" }
        "415": { $ref: "#/components/responses/Erreur" }
        "429": { $ref: "#/components/responses/TropDeTentatives" }
  /deconnexion:
    post:
      tags: [compte]
      operationId: deconnexion
      summary: Revoque la session et rend la place de connexion du fournisseur
      responses:
        "204": { description: "Deconnecte, cookie efface" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /compte:
    get:
      tags: [compte]
      operationId: compte
      summary: Session courante et profils du compte
      responses:
        "200":
          description: Le compte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compte" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /compte/mot-de-passe:
    post:
      tags: [compte]
      operationId: changerMotDePasse
      summary: Change le mot de passe et revoque les autres sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangementMotDePasse" }
      responses:
        "204": { description: "Mot de passe change" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "429": { $ref: "#/components/responses/TropDeTentatives" }
  /compte/profils:
    get:
      tags: [compte]
      operationId: profils
      summary: Profils du compte
      responses:
        "200":
          description: Les profils, du plus ancien au plus recent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListeProfils" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
    post:
      tags: [compte]
      operationId: creerProfil
      summary: Cree un profil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NouveauProfil" }
      responses:
        "201":
          description: Profil cree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profil" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/Erreur" }
  /compte/profils/{profil}:
    delete:
      tags: [compte]
      operationId: supprimerProfil
      summary: Supprime un profil du compte
      parameters:
        - { name: profil, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "204": { description: "Profil supprime (son etat avec)" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /compte/profil-actif:
    put:
      tags: [compte]
      operationId: choisirProfil
      summary: Choisit le profil actif de la session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilActif" }
      responses:
        "204": { description: "Profil actif change" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /categories:
    get:
      tags: [catalogue]
      operationId: categories
      summary: Categories d'un type de contenu
      parameters:
        - { name: type, in: query, required: true, schema: { $ref: "#/components/schemas/TypeContenu" } }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Categories ordonnees
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCategories" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /chaines:
    get:
      tags: [catalogue]
      operationId: chaines
      summary: Chaines (filtre par categorie, recherche, pagination)
      parameters:
        - { $ref: "#/components/parameters/Categorie" }
        - { $ref: "#/components/parameters/Recherche" }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une page de chaines
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageChaines" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /chaines/{id}:
    get:
      tags: [catalogue]
      operationId: chaine
      summary: Une chaine
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: La chaine
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chaine" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /films:
    get:
      tags: [catalogue]
      operationId: films
      summary: Films (filtre par categorie, recherche, pagination)
      parameters:
        - { $ref: "#/components/parameters/Categorie" }
        - { $ref: "#/components/parameters/Recherche" }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une page de films
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageFilms" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /films/{id}:
    get:
      tags: [catalogue]
      operationId: film
      summary: Un film
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Le film
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Film" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /series:
    get:
      tags: [catalogue]
      operationId: series
      summary: Series (filtre par categorie, recherche, pagination)
      parameters:
        - { $ref: "#/components/parameters/Categorie" }
        - { $ref: "#/components/parameters/Recherche" }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une page de series
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageSeries" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /series/{id}:
    get:
      tags: [catalogue]
      operationId: serie
      summary: Une serie
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: La serie
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Serie" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
  /series/{id}/saisons:
    get:
      tags: [catalogue]
      operationId: saisons
      summary: Saisons et episodes d'une serie (interroge le fournisseur)
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
      responses:
        "200":
          description: Saisons et episodes, chaque episode a son adresse de lecture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListeSaisons" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "502": { $ref: "#/components/responses/Erreur" }
  /catalogue/version:
    get:
      tags: [catalogue]
      operationId: catalogueVersion
      summary: Manifeste du catalogue (version et effectifs), pour decider d'un import
      description: |
        Tres leger (une seule requete SQL de comptage). `version` est l'ETag (sans les guillemets
        ni le prefixe `W/`) commun a TOUS les exports : tant qu'il ne change pas, l'interface
        n'a aucune donnee a retelecharger. Il change a chaque synchronisation reussie d'un fournisseur.
      parameters:
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Version et effectifs
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManifesteCatalogue" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /catalogue/export:
    get:
      tags: [catalogue]
      operationId: catalogueExport
      summary: Export en bloc d'un type de contenu (import initial de l'interface)
      description: |
        Flux NDJSON (`application/x-ndjson`, un objet JSON par ligne, ecrit au fil de l'eau : le
        serveur ne tient jamais tout le catalogue en memoire, le client peut parser par lots).
        Compresse en gzip quand `Accept-Encoding: gzip` (`Content-Encoding: gzip`). Les lignes ont
        EXACTEMENT les schemas `Chaine`, `Film`, `Serie` ou `Categorie` (memes champs que les
        listes pagineees, noms BRUTS du fournisseur, jamais retouches), triees par categorie puis
        ordre du fournisseur. Pas de pagination ni de plafond `pagination_max`.
        En-tetes : `ETag` = celui de `/catalogue/version` ; `X-Elements` = nombre de lignes
        (pour la barre de progression). `If-None-Match` correspondant -> `304` sans corps.
        `type=categories` renvoie les categories des TROIS types (champ `type` de chaque ligne).
        Une resynchronisation en cours d'envoi ne mele pas deux versions : la lecture se fait dans
        une transaction de lecture unique (instantane SQLite).
        Le direct etant mono-fournisseur, `type=live` n'exporte que les chaines de celui-ci.
        Authentification : session. Charge : meme limite de debit que les autres routes.
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [categories, live, vod, series] } }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Une ligne JSON par element
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Elements: { schema: { type: integer } }
          content:
            application/x-ndjson: { schema: { type: string } }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /recherche:
    get:
      tags: [catalogue]
      operationId: recherche
      summary: Recherche dans les chaines, films et series
      description: "`limite` s'applique a chacune des trois listes ; pas de `decalage` (utiliser les listes pour paginer)."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Resultats par type
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recherche" }
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /live/{fichier}:
    get:
      tags: [live]
      operationId: livePlaylist
      summary: Playlist HLS d'une chaine (`<numero>.m3u8`)
      description: |
        `fichier` = numero de la chaine suivi de `.m3u8` (champ `lecture` d'une chaine). Le relais
        est mono-fournisseur : le numero est celui du fournisseur du direct.
        Authentification : session OU compte technique local. Reservation de la connexion du
        fournisseur au premier appel (`503` + `Retry-After` si elle est occupee).
      security: [{ session: [] }, { local: [] }]
      parameters:
        - { name: fichier, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}\.m3u8$' } }
      responses:
        "200":
          description: Playlist HLS reecrite (segments sous `/live/{chaine}/seg/{jeton}`)
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "502": { $ref: "#/components/responses/Erreur" }
        "503": { $ref: "#/components/responses/Occupe" }
  /live/{chaine}/seg/{jeton}:
    get:
      tags: [live]
      operationId: liveSegment
      summary: Un segment HLS
      description: |
        `jeton` est signe et LIE a la chaine du chemin : un jeton d'une autre chaine est refuse
        (`403`). `Range` est transmis.
      security: [{ session: [] }, { local: [] }]
      parameters:
        - { name: chaine, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: jeton, in: path, required: true, schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: Octets du segment
          content:
            video/mp2t: { schema: { type: string, format: binary } }
        "206": { description: "Intervalle demande" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "502": { $ref: "#/components/responses/Erreur" }
        "503": { $ref: "#/components/responses/Occupe" }
  /live/{chaine}/fin:
    post:
      tags: [live]
      operationId: liveFin
      summary: L'interface a fini de lire cette chaine (rend la place du fournisseur tout de suite)
      description: |
        Corps vide. Libere le bail de la session SEULEMENT si elle lit encore `chaine` (apres un
        zapping, l'appel tardif de l'ancienne chaine ne fait rien). Idempotent, jamais `503`.
        Appele a la fermeture du lecteur (`fetch` avec `keepalive` ou `sendBeacon`). Session seulement (le compte technique local ne fait que lire) ; refuse si une requete d'ecriture porte un `Origin` etranger (comme
        toute ecriture). Sans cet appel, la place n'est rendue qu'a l'expiration du bail.
      parameters:
        - { name: chaine, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
      responses:
        "204": { description: "Fait (ou rien a faire)" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
  /live/etat:
    get:
      tags: [admin]
      operationId: liveEtat
      summary: Statistiques du relais du direct (administrateurs)
      responses:
        "200":
          description: Mediane/p95/max des playlists et segments, essais, secours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EtatLive" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
  /image/{jeton}:
    get:
      tags: [catalogue]
      operationId: image
      summary: Une image (logo, affiche) relayee par le serveur
      description: |
        `jeton` est celui du champ `logo` / `image` d'un contenu : jamais une URL. Un jeton modifie,
        tronque ou d'un autre secret est refuse (`403 jeton_invalide`). Le serveur telecharge l'image
        chez le fournisseur au premier appel (hote et adresse IP controles, redirections reverifiees,
        delai et taille bornes, aucun cookie ni identifiant transmis, aucun bail de connexion pris), la
        garde dans un cache disque borne, puis la sert avec `ETag` (`304` sur `If-None-Match`).
        Une image absente (`404`) ou en erreur (`502`) est memorisee quelques minutes
        (`images.cache_negatif`) pour ne pas marteler le fournisseur. `Content-Type` est toujours `image/*`.
      parameters:
        - { name: jeton, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,1000}$' } }
        - { $ref: "#/components/parameters/SiAucuneCorrespondance" }
      responses:
        "200":
          description: Octets de l'image
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { schema: { type: string, example: "private, max-age=86400" } }
          content:
            image/*: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/NonModifie" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403":
          description: Jeton invalide (`jeton_invalide`) ou adresse non autorisee (`hote_refuse`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "404":
          description: Image absente chez le fournisseur (`image_introuvable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "502":
          description: Image indisponible, trop grosse ou qui n'en est pas une (`image_indisponible`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "503": { $ref: "#/components/responses/Occupe" }
  /vod/{id}:
    get:
      tags: [vod]
      operationId: vodLecture
      summary: Lit un film ou un episode (Range pris en charge)
      description: |
        Remux ou transcodage audio automatiques si le navigateur ne sait pas lire le format.
        Authentification : session OU compte technique local.

        **Mode et duree lisibles par le client** : un `<video>` ne voit ni le statut d'erreur ni les
        en-tetes. L'interface envoie donc d'abord `HEAD /vod/{id}` : meme statut que `GET` (401, 404,
        415, 503 + `Retry-After`...), memes en-tetes, aucun octet de video, aucun ffmpeg lance. Sur
        `200`/`206` : `X-Mytv-Mode` = `direct` (relais d'octets, `Accept-Ranges: bytes`), `remux`
        ou `audio` (flux fabrique, `Accept-Ranges: none`, seek par `?t=`) ; `X-Mytv-Duree` = duree
        totale en secondes entieres quand la sonde la connait (absent sinon).
      security: [{ session: [] }, { local: [] }]
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
        - { name: Range, in: header, required: false, schema: { type: string, maxLength: 128 } }
        - { name: X-Mytv-Client, in: header, required: false, description: "`cast` : lecteur capable de lire le HEVC (voir 415)", schema: { type: string, maxLength: 16 } }
      responses:
        "200":
          description: Flux video
          headers:
            X-Mytv-Mode: { schema: { type: string, enum: [direct, remux, audio] } }
            X-Mytv-Duree: { schema: { type: integer }, description: "Duree totale en secondes (absent si inconnue)" }
          content:
            "video/*": { schema: { type: string, format: binary } }
        "206":
          description: "Intervalle demande, `Content-Range` coherent"
          headers:
            X-Mytv-Mode: { schema: { type: string, enum: [direct] } }
            X-Mytv-Duree: { schema: { type: integer } }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "404": { $ref: "#/components/responses/Erreur" }
        "415": { description: "Format non lisible dans un navigateur (`code` = `format_hevc_non_lisible` pour une video HEVC, `format_non_lisible` sinon ; le `message` nomme le codec). Avec `vod.relais_brut_hevc` actif, un client qui envoie `X-Mytv-Client: cast` recoit le HEVC tel quel (mode `direct`).", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "416": { $ref: "#/components/responses/Erreur" }
        "501": { $ref: "#/components/responses/NonDisponible" }
        "503": { $ref: "#/components/responses/Occupe" }
  /epg/chaines/{id}/maintenant:
    get:
      tags: [epg]
      operationId: epgMaintenant
      summary: Programme en cours et suivant d'une chaine
      parameters:
        - { $ref: "#/components/parameters/ContenuID" }
      responses:
        "200":
          description: Les deux programmes (null si inconnus)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnCours" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /epg/grille:
    get:
      tags: [epg]
      operationId: epgGrille
      summary: Grille des programmes de plusieurs chaines sur une plage
      description: |
        Une chaine inconnue ou sans guide donne un tableau vide (jamais une erreur). Reponse
        compressee en gzip quand `Accept-Encoding: gzip` (200 chaines x 6 h : ~500 Ko -> ~10 Ko).
      parameters:
        - name: chaines
          in: query
          required: true
          description: Identifiants separes par des virgules (au plus `api.pagination_max`).
          schema: { type: string, maxLength: 4096 }
        - { name: de, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: a, in: query, required: true, description: "Apres `de`, au plus `api.grille_fenetre_max` plus tard.", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Programmes par chaine, ordonnes par debut
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grille" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/favoris:
    get:
      tags: [profil]
      operationId: favoris
      summary: Favoris du profil actif, dans l'ordre d'ajout
      parameters:
        - { $ref: "#/components/parameters/Limite" }
        - { $ref: "#/components/parameters/Decalage" }
      responses:
        "200":
          description: Une page d'identifiants de contenus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageIdentifiants" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/favoris/{id}:
    put:
      tags: [profil]
      operationId: ajouterFavori
      summary: Ajoute un favori (idempotent)
      parameters: [{ $ref: "#/components/parameters/ContenuID" }]
      responses:
        "204": { description: "Ajoute" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "422": { description: "Limite de profil atteinte (`code` = `limite_atteinte`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "501": { $ref: "#/components/responses/NonDisponible" }
    delete:
      tags: [profil]
      operationId: retirerFavori
      summary: Retire un favori (idempotent)
      parameters: [{ $ref: "#/components/parameters/ContenuID" }]
      responses:
        "204": { description: "Retire" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/historique:
    get:
      tags: [profil]
      operationId: historique
      summary: Historique de lecture du profil actif, du plus recent au plus ancien
      parameters:
        - { $ref: "#/components/parameters/Limite" }
      responses:
        "200":
          description: Les lectures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListeLectures" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/historique/{id}:
    put:
      tags: [profil]
      operationId: enregistrerLecture
      summary: Enregistre la position de reprise d'un contenu
      parameters: [{ $ref: "#/components/parameters/ContenuID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Position" }
      responses:
        "204": { description: "Enregistre" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "422": { description: "Limite de profil atteinte (`code` = `limite_atteinte`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "501": { $ref: "#/components/responses/NonDisponible" }
    delete:
      tags: [profil]
      operationId: oublierLecture
      summary: Retire un contenu de l'historique
      parameters: [{ $ref: "#/components/parameters/ContenuID" }]
      responses:
        "204": { description: "Retire" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /profil/reglages:
    get:
      tags: [profil]
      operationId: reglages
      summary: Reglages synchronises du profil actif
      responses:
        "200":
          description: Les reglages et leur revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reglages" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { $ref: "#/components/responses/ProfilRequis" }
        "501": { $ref: "#/components/responses/NonDisponible" }
    put:
      tags: [profil]
      operationId: ecrireReglages
      summary: Remplace les reglages si `revision` est la revision courante
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reglages" }
      responses:
        "200":
          description: Reglages a jour (nouvelle revision)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reglages" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "409": { description: "Conflit de revision (`code` = `conflit`) ou profil requis", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "422": { description: "Limite de profil atteinte (`code` = `limite_atteinte`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /metriques:
    get:
      tags: [admin]
      operationId: metriques
      summary: Metriques au format Prometheus (administrateurs)
      responses:
        "200":
          description: Texte Prometheus
          content:
            text/plain: { schema: { type: string } }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
        "501": { $ref: "#/components/responses/NonDisponible" }
  /diagnostic/evenements:
    get:
      tags: [admin]
      operationId: diagnostic
      summary: Evenements recents, sans identifiant ni jeton (administrateurs)
      parameters:
        - { name: type, in: query, required: false, description: "Prefixe de type (`hls`, `video:erreur`...)", schema: { type: string, maxLength: 40 } }
        - { name: limite, in: query, required: false, description: "Defaut 200, maximum 1000", schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Evenements du plus recent au plus ancien
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostic" }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "403": { $ref: "#/components/responses/Interdit" }
        "501": { $ref: "#/components/responses/NonDisponible" }
    post:
      tags: [admin]
      operationId: envoyerEvenements
      summary: L'interface envoie les evenements de lecture qu'elle subit (tout utilisateur connecte)
      description: |
        `Content-Type: application/json` obligatoire. Taille bornee par `diagnostic.envoi_max`,
        nombre d'evenements par `diagnostic.evenements_par_envoi` (le surplus est ignore),
        debit par session par `diagnostic.debit_evenements` (`429 trop_de_requetes`). Identifiants,
        jetons et chaines de requete sont masques avant tout stockage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvoiEvenements" }
      responses:
        "200":
          description: Evenements retenus et ignores
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recus, ignores]
                properties:
                  recus: { type: integer }
                  ignores: { type: integer }
        "400": { $ref: "#/components/responses/RequeteInvalide" }
        "401": { $ref: "#/components/responses/NonAuthentifie" }
        "413": { description: "Envoi trop volumineux (`code` = `corps_trop_gros`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "415": { description: "Type de contenu autre que JSON (`code` = `format_non_json`)", content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } } }
        "429":
          description: Trop d'evenements (`code` = `trop_de_requetes`)
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Erreur" } } }
        "501": { $ref: "#/components/responses/NonDisponible" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-mytv
      description: Cookie de session (nom `mytv` quand `comptes.cookie_securise` est faux).
    local:
      type: apiKey
      in: header
      name: X-Aucun
      description: |
        Compte technique local : AUCUN en-tete, reconnu a l'adresse du client (plages
        `comptes.plages_locales`), GET/HEAD seulement, jamais administrateur.
  headers:
    ETag:
      description: Etag faible ; renvoyez-le dans `If-None-Match`.
      schema: { type: string }
  parameters:
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1 }
      description: Taille de page (bornee par `api.pagination_max`).
    Decalage:
      name: decalage
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Categorie:
      name: categorie
      in: query
      schema: { type: string, maxLength: 128 }
      description: Identifiant de categorie `<fournisseur>:<id>` (champ `id` de `/categories`).
    Recherche:
      name: q
      in: query
      schema: { type: string, maxLength: 100 }
    ContenuID:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ContenuID" }
    SiAucuneCorrespondance:
      name: If-None-Match
      in: header
      schema: { type: string, maxLength: 256 }
  responses:
    Erreur:
      description: Erreur
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    RequeteInvalide:
      description: Parametre ou corps invalide (`code` = `requete_invalide`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    NonAuthentifie:
      description: Session absente, expiree ou revoquee (`code` = `non_authentifie`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    Interdit:
      description: Reserve aux administrateurs (`code` = `interdit`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    TropDeTentatives:
      description: Limitation atteinte (`code` = `trop_de_tentatives`)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    NonModifie:
      description: Le catalogue n'a pas change depuis cet ETag (pas de corps)
    NonDisponible:
      description: Fonction non activee sur ce serveur (`code` = `non_disponible`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
    Occupe:
      description: Connexion du fournisseur occupee ; reessayer apres `Retry-After`
      headers:
        Retry-After: { schema: { type: integer } }
    ProfilRequis:
      description: Aucun profil actif sur la session (`code` = `profil_requis`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
  schemas:
    Erreur:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, description: Stable, en minuscules_et_underscores }
        message: { type: string }
    Sante:
      type: object
      additionalProperties: false
      required: [statut]
      properties:
        statut: { type: string, enum: [ok] }
    ContenuID:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,32}:[A-Za-z0-9_.-]{1,64}$'
      example: "iptva:845410"
      description: |
        `<fournisseur>:<numero>`, unique entre TOUS les types de contenu. Chez Xtream, `stream_id`
        (chaines, films) et `series_id` sont deux espaces de numeros distincts : l'identifiant d'une
        **serie** porte donc un `s` devant le numero (`iptva:s77`), celui d'une chaine ou d'un film
        non (`iptva:845410`), celui d'un **episode** porte l'extension (`iptva:77123.mkv`). Le
        numero du fournisseur (sans prefixe) n'est jamais expose : les URL de lecture sont fournies
        (`lecture`, `saisons`).
    TypeContenu:
      type: string
      enum: [live, vod, series]
    Connexion:
      type: object
      additionalProperties: false
      required: [nom, mot_de_passe]
      properties:
        nom: { type: string, maxLength: 64 }
        mot_de_passe: { type: string, maxLength: 1024, format: password }
    Session:
      type: object
      additionalProperties: false
      required: [id, nom, admin, expire]
      properties:
        id: { type: string, description: "Identifiant stable de session ; ce n'est PAS le jeton" }
        nom: { type: string, description: "Nom du compte tel qu'il a ete cree (pour l'affichage ; pas un identifiant)" }
        admin: { type: boolean }
        profil_id: { type: string }
        expire: { type: string, format: date-time }
    Compte:
      type: object
      additionalProperties: false
      required: [session, profils, limites]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        profils:
          type: array
          items: { $ref: "#/components/schemas/Profil" }
        limites:
          type: object
          description: Bornes de la configuration, pour que l'interface decoupe ses appels sans les deviner.
          additionalProperties: false
          required: [pagination_max, grille_fenetre, favoris_max, historique_max, reglages_octets_max]
          properties:
            pagination_max: { type: integer, description: "Taille maximale d'une page ET nombre maximal de chaines d'un appel `/epg/grille`" }
            grille_fenetre: { type: integer, description: "Plage maximale d'un appel `/epg/grille`, en secondes" }
            favoris_max: { type: integer }
            historique_max: { type: integer }
            reglages_octets_max: { type: integer }
    ChangementMotDePasse:
      type: object
      additionalProperties: false
      required: [ancien, nouveau]
      properties:
        ancien: { type: string, maxLength: 1024, format: password }
        nouveau: { type: string, maxLength: 1024, format: password }
    Profil:
      type: object
      additionalProperties: false
      required: [id, nom]
      properties:
        id: { type: string }
        nom: { type: string, maxLength: 64 }
    NouveauProfil:
      type: object
      additionalProperties: false
      required: [nom]
      properties:
        nom: { type: string, maxLength: 64 }
    ProfilActif:
      type: object
      additionalProperties: false
      required: [profil_id]
      properties:
        profil_id: { type: string }
    ListeProfils:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items: { $ref: "#/components/schemas/Profil" }
    Pagination:
      type: object
      required: [limite, decalage, suivant]
      properties:
        limite: { type: integer }
        decalage: { type: integer }
        suivant: { type: integer, nullable: true, description: "Decalage de la page suivante, null a la fin" }
    ManifesteCatalogue:
      type: object
      additionalProperties: false
      required: [version, categories, chaines, films, series, synchronise]
      properties:
        version: { type: string, description: "Meme valeur que l'ETag (sans guillemets ni `W/`)" }
        categories: { type: integer }
        chaines: { type: integer }
        films: { type: integer }
        series: { type: integer }
        synchronise: { type: string, format: date-time, nullable: true, description: "Derniere synchronisation reussie (null si jamais)" }
    Categorie:
      type: object
      additionalProperties: false
      required: [id, fournisseur, type, nom, ordre]
      properties:
        id: { type: string, description: "`<fournisseur>:<id chez le fournisseur>`", example: "iptva:12" }
        fournisseur: { type: string }
        type: { $ref: "#/components/schemas/TypeContenu" }
        nom: { type: string }
        ordre: { type: integer }
    Chaine:
      type: object
      additionalProperties: false
      required: [id, nom, numero, categorie, lecture]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        logo: { type: string, description: "Adresse relative `/api/v1/image/<jeton>` (jamais l'adresse du fournisseur) ; absent si la chaine n'a pas de logo" }
        numero: { type: integer, description: Numero de chaine affiche }
        epg_id: { type: string }
        categorie: { type: string, description: "Identifiant de categorie `<fournisseur>:<id>`" }
        ajoute: { type: string, format: date-time, nullable: true, description: "Date d'ajout chez le fournisseur (null si inconnue)" }
        lecture: { type: string, description: "Adresse relative de la playlist HLS", example: "/api/v1/live/845410.m3u8" }
    Film:
      type: object
      additionalProperties: false
      required: [id, nom, categorie, extension, note, lecture]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        image: { type: string, description: "Adresse relative `/api/v1/image/<jeton>` ; absent si pas d'affiche" }
        categorie: { type: string }
        extension: { type: string }
        note: { type: number }
        annee: { type: string }
        ajoute: { type: string, format: date-time, nullable: true }
        lecture: { type: string, example: "/api/v1/vod/iptva:5521" }
    Serie:
      type: object
      additionalProperties: false
      required: [id, nom, categorie, note, saisons]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        nom: { type: string }
        image: { type: string, description: "Adresse relative `/api/v1/image/<jeton>` ; absent si pas d'affiche" }
        categorie: { type: string }
        note: { type: number }
        annee: { type: string }
        ajoute: { type: string, format: date-time, nullable: true, description: "Derniere modification chez le fournisseur (`last_modified`), null si inconnue" }
        saisons: { type: string, description: "Adresse relative des saisons", example: "/api/v1/series/iptva:s77/saisons" }
    Episode:
      type: object
      additionalProperties: false
      required: [id, numero, titre, extension, duree, lecture]
      properties:
        id: { $ref: "#/components/schemas/ContenuID" }
        numero: { type: integer }
        titre: { type: string }
        extension: { type: string }
        duree: { type: integer, description: secondes, 0 si inconnue }
        lecture: { type: string }
    Saison:
      type: object
      additionalProperties: false
      required: [numero, episodes]
      properties:
        numero: { type: integer }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Episode" }
    ListeSaisons:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items: { $ref: "#/components/schemas/Saison" }
    PageCategories:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Categorie" } }
    PageChaines:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Chaine" } }
    PageFilms:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Film" } }
    PageSeries:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/Serie" } }
    PageIdentifiants:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [elements]
          properties:
            elements: { type: array, items: { $ref: "#/components/schemas/ContenuID" } }
    Recherche:
      type: object
      additionalProperties: false
      required: [chaines, films, series]
      properties:
        chaines: { type: array, items: { $ref: "#/components/schemas/Chaine" } }
        films: { type: array, items: { $ref: "#/components/schemas/Film" } }
        series: { type: array, items: { $ref: "#/components/schemas/Serie" } }
    Programme:
      type: object
      additionalProperties: false
      required: [debut, fin, titre]
      properties:
        debut: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        titre: { type: string }
        description: { type: string }
        categorie: { type: string }
    EnCours:
      type: object
      additionalProperties: false
      required: [courant, suivant]
      properties:
        courant: { allOf: [{ $ref: "#/components/schemas/Programme" }], nullable: true }
        suivant: { allOf: [{ $ref: "#/components/schemas/Programme" }], nullable: true }
    Grille:
      type: object
      additionalProperties: false
      required: [chaines]
      properties:
        chaines:
          type: object
          description: Programmes par identifiant de chaine
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/Programme" }
    Lecture:
      type: object
      additionalProperties: false
      required: [contenu, position, duree, vu]
      properties:
        contenu: { $ref: "#/components/schemas/ContenuID" }
        serie: { $ref: "#/components/schemas/ContenuID", description: "Serie parente quand `contenu` est un episode" }
        position: { type: integer, description: "secondes" }
        duree: { type: integer, description: "secondes, 0 si inconnue (direct)" }
        vu: { type: string, format: date-time }
    ListeLectures:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements: { type: array, items: { $ref: "#/components/schemas/Lecture" } }
    Position:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        position: { type: integer, minimum: 0, description: "secondes" }
        duree: { type: integer, minimum: 0, description: "secondes" }
        serie:
          allOf: [{ $ref: "#/components/schemas/ContenuID" }]
          description: |
            REQUIS quand l'identifiant du contenu est un episode (`fournisseur:77123.mkv`,
            extension apres le numero), INTERDIT sinon (400). Doit etre une serie du catalogue du
            meme fournisseur : sans elle l'historique jugerait l'episode orphelin.
    Reglages:
      type: object
      additionalProperties: false
      required: [valeurs, revision]
      properties:
        valeurs:
          type: object
          additionalProperties: { type: string }
        revision: { type: integer, format: int64 }
    EtatLive:
      type: object
      description: Statistiques du relais (champs definis par internal/live, Resume).
      additionalProperties: true
    EnvoiEvenements:
      type: object
      additionalProperties: false
      required: [evenements]
      properties:
        appareil: { type: string, maxLength: 80, description: "Identifiant choisi par l'appareil ; seule une empreinte est conservee" }
        agent: { type: string, maxLength: 300 }
        evenements:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [type]
            properties:
              type: { type: string, maxLength: 40, description: "`echantillon`, `hls:*`, `video:*`, `image:retour`..." }
              message: { type: string }
    Diagnostic:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [horodatage, source, type]
            properties:
              horodatage: { type: string, format: date-time }
              source: { type: string, enum: [serveur, client] }
              type: { type: string }
              message: { type: string }
              appareil: { type: string, description: "Empreinte courte, jamais l'identifiant" }
              agent: { type: string }
              donnees: { type: object, additionalProperties: true }
