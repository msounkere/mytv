# Configuration de mytv. Toutes les durees s'ecrivent « 800ms », « 90s », « 5m », « 24h ».
# Les SECRETS ne sont jamais ecrits ici : on designe une variable d'environnement
# (env) ou un fichier (fichier, droits 600).

serveur:
  ecoute: 10.77.0.2:8080            # adresse:port
  domaine_public: https://mytv.msocasa.com
  secret_signature: { env: MYTV_SECRET }   # signe les URL de segments (32 caracteres minimum)

stockage:
  fichier: /var/lib/mytv/mytv.db    # SQLite : catalogue, EPG, comptes, etat

# Plusieurs fournisseurs possibles. L'id prefixe tous les identifiants de contenu
# (« iptva:845410 ») : aucune collision entre fournisseurs.
fournisseurs:
  - id: iptva
    type: xtream
    actif: true
    base: http://line.dndnscloud.ru
    utilisateur:  { env: IPTVA_USER }
    mot_de_passe: { env: IPTVA_PASS }
    connexions_max: 1               # limite du compte chez le fournisseur
    priorite: 1                     # le plus petit est prefere (basculement futur)
    # user_agent: "..."             # vide = agent de navigateur
    rafraichissement:               # evite de recharger le catalogue a chaque demande
      catalogue: 24h                # age maximal du catalogue en base
      epg: 6h
      heure: "05:00"                # synchronisation quotidienne ; vide = aucune
      au_demarrage: false
    reseau:
      delai_connexion: 5s
      delai_entete: 6s              # attente de la reponse du fournisseur
      delai_playlist: 4s            # par essai
      essais_playlist: 3
      attente_essais: 250ms
      delai_segment: 20s
      essais_segment: 2
      requetes_amont_max: 3
      # proxy_sortie: http://10.77.0.2:8888   # sortie vers le fournisseur par un proxy (VPN, tunnel maison)
      fermer_connexions_flux: true  # Connection: close pour playlists, segments, films (l'API garde le keep-alive)

live:
  fraicheur_playlist: 800ms         # une playlist plus recente est reutilisee
  peremption_secours: 75s           # age max d'une playlist servie en secours
  cache_segments: { nombre: 14, octets: 100663296 }
  # Conversion du direct : les navigateurs ne lisent ni l'EAC3/AC3/DTS ni le HEVC.
  duree_sonde: 10m                  # validite du verdict d'une chaine (sonde d'un segment)
  echec_sonde: 1m                   # pause avant de resonder une chaine dont la sonde a echoue
  delai_sonde: 8s                   # borne d'une premiere sonde ; au-dela, relais brut
  hauteur_max_reencodage: 1080      # un HEVC plus haut (4K) est refuse (format_hevc_non_lisible)
  reencodage_video: true            # faux : tout reencodage video est refuse (audio seul converti)
  dossier_hls: hls_live             # un sous-dossier temporaire par transcodage (relatif au repertoire de travail)
  inactivite_transcodage: 60s       # sans requete du lecteur, ffmpeg est arrete et son dossier supprime
  delai_demarrage_transcodage: 30s  # borne entre le lancement de ffmpeg et ses premiers segments
  segments_amorce: 2                # segments amont donnes a ffmpeg des le depart
  segment_hls: 4                    # secondes d'un segment produit
  liste_hls: 6                      # segments annonces par la playlist produite
  retention_noeud: 10m              # playlists rechargees sur le noeud de diffusion (apres le 302) au plus ce delai ; echec = retour au central
  eco:                              # mode economie (qualite=eco) : conversion video a definition et debit reduits
    hauteur: 480                    # pixels (240 a 1080)
    debit_kbps: 1200                # debit video en kbit/s (300 a 6000) ; audio AAC 96 kbit/s

vod:
  pause_max: 5m                    # lecteur en pause au-dela : la place du fournisseur est rendue (0 = jamais)
  grace_annulation: 250ms          # une nouvelle plage du meme film laisse ce delai a la precedente pour finir seule
  retention_adresse: 10m           # adresse finale (apres 302) retenue par la source du remux, au plus ce delai
  premier_octet: 60s               # ffmpeg muet au-dela : processus arrete, 502
  relais_brut_hevc: false           # true : un client « X-Mytv-Client: cast » recoit le HEVC tel quel (sur demande seulement)

bail:                               # reservation de la connexion fournisseur par une lecture
  ttl: 90s
  patience_max: 2m                  # attente d'une place quand le fournisseur refuse (407)
  reessai: 3s                       # premiere pause ; double ensuite a chaque 407 consecutif
  reessai_max: 30s                  # plafond du retrait progressif
  gigue: 0.2                        # +/- 20 % sur chaque pause
  retry_apres: 15s                  # Retry-After du 503 d'occupation, double a chaque refus consecutif...
  retry_apres_max: 60s              # ...jusqu'a ce plafond
  garde_fournisseur: 100s           # le fournisseur garde la place d'une lecture de mytv ~100 s
  succes_prise: 2                   # reussites consecutives avant qu'un refus soit une prise de place
  fenetre_prise: 30s

comptes:
  duree_session: 720h
  cookie_securise: true
  local_utilisateur: local_user     # compte technique des lecteurs sans cookie (Cast)
  plages_locales: [192.168.50.0/24] # seules origines du compte technique (jamais l'exterieur)
  proxys_fiables: []                # pairs dont on croit X-Forwarded-For
  cast_duree: 12h                   # validite d'un lien de diffusion signe (televiseur, sans cookie), > 0

remux:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  processus_max: 2
  duree_sonde: 168h

images:                             # proxy d'images signe (logos, affiches), US-23
  cache_dossier: /var/lib/mytv/images   # cree en 700
  cache_octets: 268435456           # 256 Mio, eviction du plus ancien
  delai: 8s                         # par telechargement amont
  taille_max: 2097152               # 2 Mio par image
  concurrence_max: 4                # telechargements simultanes (aucun bail pris)
  cache_negatif: 5m                 # image absente / en erreur : pas redemandee

metadonnees:                        # details des films/series (synopsis, genre...), a la demande
  actif: true
  duree_vie: 720h                   # au-dela, redemandes (les anciens restent servis si le fournisseur echoue)
  delai: 8s                         # un appel au fournisseur
  concurrence_max: 2                # appels simultanes
  appels_par_minute: 30
  coupe_circuit: 10m                # aucun appel apres un refus 401/403/458
  echec_attente: 2m                 # pas de nouvel essai pour un contenu en echec
  memoire_saisons: 30s

diagnostic: { actif: true, conservation: 72h }
journal: { niveau: info }

supervision:                        # surveillance du compte fournisseur (US-25)
  alerte_expiration: 168h           # avertir (journal, webhook) a moins de 7 jours de l'expiration
  echecs_synchro: 3                 # echecs de synchronisation consecutifs avant notification
  periode_alerte: 24h               # anti-rafale : un message par evenement et par periode
  intervalle_info: 6h               # relecture de user_info (appel API, aucun flux)
  cache_occupation: 15s             # diagnostic d'un 407 persistant : au plus une lecture de user_info par intervalle
  # webhook:                        # facultatif ; POST JSON, https obligatoire
  #   url: https://ntfy.example.org/mytv
  #   secret: { env: MYTV_WEBHOOK_SECRET }   # signe le corps (X-Mytv-Signature: sha256=...)

catalogue:                          # version fondee sur le contenu, garde et differences (US-36)
  perte_max: 0.5                    # part des chaines, films OU series qu'une synchronisation peut perdre
                                    # avant d'etre refusee (ancien catalogue conserve) ; ]0 ; 1]
  historique_versions: 14           # versions dont les differences sont gardees (export ?depuis=)

sauvegarde:                         # sauvegarde quotidienne de la base, sans arreter le service (US-26)
  heure: "03:30"                    # heure locale ; vide = desactivee (mytv --sauvegarder reste possible)
  # dossier: /var/lib/mytv/sauvegardes   # defaut : sauvegardes/ a cote de la base (cree en 700)
  conservation: 14                  # jours (la plus recente est toujours gardee)
